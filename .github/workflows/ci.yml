name: Build and compatibility checks

on:
  push:
    branches: [main, master, 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  desktop-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Restore desktop dependencies
        run: dotnet restore Ultimate_Gshop.csproj
      - name: Build the desktop application
        run: dotnet build Ultimate_Gshop.csproj --configuration Release --no-restore --warnaserror
      - name: Validate publish output
        run: dotnet publish Ultimate_Gshop.csproj --configuration Release --no-restore --self-contained false --output artifacts/publish
      - name: Verify published game assets
        shell: pwsh
        run: ./scripts/Test-AssetBaseline.ps1 -RepositoryRoot artifacts/publish -ManifestPath Docs/baseline/assets.json -Mode Published

  format-tests:
    name: Compatibility tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Verify original resource paths and bytes
        run: ./scripts/Test-AssetBaseline.ps1
      - name: Restore the application compatibility test suite
        run: dotnet restore tests/Ultimate_Gshop.Format.Tests/Ultimate_Gshop.Format.Tests.csproj
      - name: Run compatibility tests
        run: |
          $arguments = @(
            'test', '--project', 'tests/Ultimate_Gshop.Format.Tests/Ultimate_Gshop.Format.Tests.csproj',
            '--configuration', 'Release', '--no-restore'
          )
          if ('${{ runner.os }}' -eq 'Linux') {
            $arguments += @(
              '--coverage', '--coverage-output-format', 'cobertura',
              '--coverage-output', (Join-Path $PWD 'TestResults/application-coverage.cobertura.xml'),
              '--coverage-settings', 'tests/application-coverage.config'
            )
          }
          & dotnet @arguments
          exit $LASTEXITCODE
      - name: Report and enforce application coverage baseline
        if: runner.os == 'Linux'
        run: ./scripts/Write-CoverageSummary.ps1
      - name: Upload application coverage
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: application-coverage
          path: |
            TestResults/application-coverage.cobertura.xml
            TestResults/coverage/index.html
          if-no-files-found: error
          retention-days: 7

  readme-badges:
    name: Update README badges
    needs: [desktop-build, format-tests]
    if: >-
      github.event_name == 'push' && github.repository == 'Stertz/Ultimate_Gshop' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@v8
        with:
          name: application-coverage
          path: artifacts/coverage
      - name: Refresh measured coverage and stack versions
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHECKED_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = git ls-remote origin "refs/heads/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($remote -split '\s+')[0] -ne $env:CHECKED_COMMIT) {
            Write-Output 'A newer source commit exists; its CI run will update the badges.'
            exit 0
          }
          ./scripts/Update-ReadmeBadges.ps1 -CoverageReportPath artifacts/coverage/application-coverage.cobertura.xml -Repository $env:GITHUB_REPOSITORY
          git diff --quiet -- README.md
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh measured README badges [skip ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:refs/heads/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            $remote = git ls-remote origin "refs/heads/$env:DEFAULT_BRANCH"
            if ($LASTEXITCODE -eq 0 -and ($remote -split '\s+')[0] -ne $env:CHECKED_COMMIT) {
              Write-Output 'The branch advanced during the update; retaining its newer content.'
              exit 0
            }
            throw 'Could not publish the README badge update.'
          }

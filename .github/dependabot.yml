version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      avalonia-compatible-updates:
        patterns: ['Avalonia*']
        update-types: [minor, patch]
      reactive-compatible-updates:
        patterns: ['ReactiveUI*', 'DynamicData', 'System.Reactive']
        update-types: [minor, patch]
      testing-compatible-updates:
        patterns: ['xunit*', 'Microsoft.Testing.*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
